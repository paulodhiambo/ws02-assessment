openapi: 3.0.1
info:
  title: Jamii Savings Accounts API
  version: v1
  description: |
    Read-only account information for Jamii Savings customers.

    Backed by WSO2 Micro Integrator (`AccountBalanceAPI`), which reads the
    accounts database through a parameterised data service query.

    **Security:** OAuth2 (client credentials or authorization code).
    **Throttling:** Gold / Silver subscription tiers.
  contact:
    name: Jamii Savings Integrations Team
servers:
  - url: https://localhost:8243/jamii/accounts/v1
    description: Dev gateway
security:
  - default: []
paths:
  /{accountNumber}/balance:
    get:
      operationId: getAccountBalance
      summary: Get the balance of an account
      description: Returns the current status and balance of a single account.
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: 10-digit account number.
          schema:
            type: string
            pattern: '^[0-9]{10}$'
            example: '0100000001'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Account found.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
              example:
                accountNumber: '0100000001'
                status: ACTIVE
                balance:
                  amount: 152340.75
                  currency: KES
                requestId: 10d00c1e-fa31-4e58-9802-49ab7e69bcbf
                timestamp: '2026-10-07T16:29:32.347Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No account with this number (`ACCOUNT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ACCOUNT_NOT_FOUND
                  message: No account exists with the given account number.
                  status: 404
                requestId: 82ae2640-6e70-4f25-b4c5-e062b0f649ed
                correlationId: demo-corr-0001
                timestamp: '2026-10-07T16:29:32.389Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The accounts database is unavailable (`ACCOUNT_DB_UNAVAILABLE`). Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
components:
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://localhost:9443/oauth2/authorize
          scopes: {}
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation id (8-64 chars of A-Z a-z 0-9 . _ -). Generated when absent.
      schema:
        type: string
  headers:
    X-Correlation-ID:
      description: The caller's correlation id, or a generated one.
      schema:
        type: string
    X-Request-ID:
      description: Unique id of this request; quote it when contacting support.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The account number is not 10 digits (`INVALID_ACCOUNT_NUMBER`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid access token (returned by the API gateway).
    TooManyRequests:
      description: Subscription tier quota exceeded (returned by the API gateway).
  schemas:
    AccountBalance:
      type: object
      required: [accountNumber, status, balance, requestId, timestamp]
      properties:
        accountNumber:
          type: string
          example: '0100000001'
        status:
          type: string
          enum: [ACTIVE, DORMANT, CLOSED]
        balance:
          type: object
          required: [amount, currency]
          properties:
            amount:
              type: number
              format: double
              example: 152340.75
            currency:
              type: string
              description: ISO 4217 code.
              example: KES
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    Error:
      type: object
      description: Error envelope shared by every Jamii Savings API.
      required: [error, requestId, correlationId, timestamp]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              example: ACCOUNT_NOT_FOUND
            message:
              type: string
            status:
              type: integer
              description: Same as the HTTP status code.
        requestId:
          type: string
          format: uuid
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
