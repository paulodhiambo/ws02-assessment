# GitHub Actions mirror of the Jenkinsfile. Both call the same scripts/, so the
# two pipelines cannot drift apart: build -> unit tests -> dev environment ->
# all-or-nothing deploy -> integration/chaos tests -> (approval) -> prod.
#
# Prod approval: Settings -> Environments -> "prod" -> Required reviewers.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev:
    name: Build, deploy and test (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAR_VERSION: 1.0.${{ github.run_number }}
      # Local mocks: deterministic, and they let the failure tests run.
      CUSTOMER_BACKEND_URL: http://customer-mock:3000
      LOAN_SOAP_BACKEND_URL: http://soap-mock:8088/calculator.asmx
      APICTL_CONFIG_DIR: ${{ github.workspace }}/.apictl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-go@v5
        with:
          go-version-file: mocks/customer-service/go.mod
          cache: false

      - name: Build & package
        run: scripts/build.sh --skip-tests --version "$CAR_VERSION"

      - name: Unit tests
        run: scripts/test.sh --unit

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ env.CAR_VERSION }}
          path: |
            mi/target/cars/*.car
            dist/apim

      - name: Dev environment
        run: |
          scripts/install-apictl.sh
          docker compose --profile apim up -d --build --wait --wait-timeout 600

      - name: Deploy to MI
        run: scripts/deploy-mi.sh dev

      - name: Deploy to APIM
        id: apim
        run: scripts/deploy-apim.sh dev

      - name: Restore previous MI release (APIM deploy failed)
        if: failure() && steps.apim.outcome == 'failure'
        run: |
          if ls target/mi-previous/*.car >/dev/null 2>&1; then
            CAR_DIR=target/mi-previous scripts/deploy-mi.sh dev
          else
            echo "no previous MI release to restore (first deployment)"
          fi

      - name: Integration tests (direct to MI)
        run: scripts/test.sh --integration

      - name: Developer Portal onboarding
        run: scripts/apim-demo-consumer.sh > /dev/null

      - name: Integration tests (through the APIM gateway)
        run: scripts/test.sh --integration --apim

      - name: Chaos tests (DB and backend outages)
        run: scripts/test.sh --chaos

      - name: Event tests (bonus B - RabbitMQ consumer, DLQ, retries)
        run: scripts/test.sh --events

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p target/logs
          for s in mi apim customer-mock soap-mock accounts-db rabbitmq; do
            docker compose logs --no-color "$s" > "target/logs/$s.log" 2>&1 || true
          done

      - name: Upload logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-reports-${{ env.CAR_VERSION }}
          path: |
            target/logs
            target/test-reports
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: scripts/cleanup.sh --all || true

  prod:
    name: Promote to prod
    needs: dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    env:
      CAR_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # The exact artifacts that passed dev; nothing is rebuilt.
      - uses: actions/download-artifact@v4
        with:
          name: artifacts-${{ env.CAR_VERSION }}

      # Not wired to a real environment in this assignment: without a real
      # prod.env the scripts print the deployment plan (--dry-run).
      - name: Deploy (dry run)
        run: |
          cp infrastructure/config/prod.env.example infrastructure/config/prod.env
          scripts/deploy-mi.sh prod --dry-run
          scripts/deploy-apim.sh prod --dry-run
